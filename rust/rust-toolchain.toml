# Pin a toolchain that (a) satisfies uuid 1.27's MSRV of Rust 1.89 and
# (b) produces .so files macOS can dlopen. The previously pinned 1.89
# release generated a binary with a mis-aligned LINKEDIT string pool on
# macOS 26; stable 1.93 satisfies both constraints.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
